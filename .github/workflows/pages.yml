name: Deploy public website files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment boundary
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Stage public files only
        run: python3 tools/stage_site.py --output "$RUNNER_TEMP/public-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
