<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-labelledby="title desc"><title id="title">Solution region: imaginary part less than twice real part plus one</title><desc id="desc">Shade below the dashed line y equals2x plus1. The line crosses the real axis at minus one half and imaginary axis at1, and is excluded from the solution.</desc><defs><clipPath id="plot"><rect x="65" y="30" width="550" height="280"/></clipPath></defs><rect width="680" height="350" fill="white"/><polygon points="164.0,310.0 615,310.0 615,30.0 472.0,30.0" fill="#d7eeeb" clip-path="url(#plot)"/><path d="M65 175H635 M340 315V25" stroke="#13294b" stroke-width="1.5"/><path d="M164.0,310.0 L472.0,30.0" stroke="#167a78" stroke-width="3" stroke-dasharray="7 6"/><g font-family="system-ui" font-size="15" fill="#13294b"><text x="640" y="180">x</text><text x="350" y="25">y</text><text x="300" y="198">−½</text><text x="350" y="150">1</text><text x="450" y="248">y &lt; 2x + 1</text><text x="65" y="335">Dashed boundary excluded · shaded half-plane included</text></g></svg>